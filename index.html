<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You ❤️</title>
    <link rel="stylesheet" href="style.css">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- FLOATING HEARTS CONTAINER -->
    <div id="heartContainer"></div>

    <!-- LOADER SCREEN -->
    <div id="loader">
        <div class="spinner"></div>
        <p>Loading love...</p>
    </div>

    <!-- MAIN APP CONTAINER -->
    <main class="app-container">

        <!-- 1. WELCOME SCREEN (ÚNICO LUGAR DONDE APARECE EL NOMBRE) -->
        <section id="welcome" class="screen active">
            <div class="card">
                <div class="icon">💌</div>
                <h1>Hello Sofía!</h1>
                <p>I built a small special place for us...</p>
                <button class="btn" onclick="nextScreen('question')">Open ❤️</button>
            </div>
        </section>

        <!-- 2. QUESTION SCREEN -->
        <section id="question" class="screen">
            <div class="card">
                <div class="icon">💖</div>
                <h2>Do you want to save our relationship in this app forever?</h2>
                <div class="button-group">
                    <button class="btn btn-yes" onclick="nextScreen('letter')">Yes!</button>
                    <button class="btn btn-no" onclick="alert('Wrong answer! Try clicking Yes 😏')">No</button>
                </div>
            </div>
        </section>

        <!-- 3. LETTER SCREEN -->
        <section id="letter" class="screen">
            <div class="card">
                <div class="icon">📜</div>
                <h2>A Special Note</h2>
                <p id="typedLetter" class="letter-body"></p>
                <button id="continueLetter" class="btn" style="display: none;" onclick="saveRelationship()">Save Our Moment ❤️</button>
            </div>
        </section>

        <!-- 4. SAVING ANIMATION SCREEN -->
        <section id="saving" class="screen">
            <div class="card">
                <div class="icon">⏳</div>
                <h2>Saving our story...</h2>
                <div class="progress-bar-container">
                    <div id="savingProgress" class="progress-bar"></div>
                </div>
            </div>
        </section>

        <!-- 5. CELEBRATION & COUNTER SCREEN -->
        <section id="celebration" class="screen">
            <div class="card">
                <div class="icon">🎉</div>
                <h2>We've been together for:</h2>
                
                <div class="counter-grid">
                    <div class="counter-box">
                        <span id="years">0</span>
                        <label>Years</label>
                    </div>
                    <div class="counter-box">
                        <span id="months">0</span>
                        <label>Months</label>
                    </div>
                    <div class="counter-box">
                        <span id="days">0</span>
                        <label>Days</label>
                    </div>
                    <div class="counter-box">
                        <span id="hours">00</span>
                        <label>Hours</label>
                    </div>
                    <div class="counter-box">
                        <span id="minutes">00</span>
                        <label>Minutes</label>
                    </div>
                    <div class="counter-box">
                        <span id="seconds">00</span>
                        <label>Seconds</label>
                    </div>
                </div>

                <button class="btn" onclick="nextScreen('gallery')">See Memories 📸</button>
            </div>
        </section>

        <!-- 6. GALLERY SCREEN -->
        <section id="gallery" class="screen">
            <div class="card">
                <h2>Our Memories</h2>
                <div class="gallery-container">
                    <div class="memory visible">
                        <img src="https://picsum.photos/300/300?random=1" alt="Memory 1">
                        <p>Our First Date</p>
                    </div>
                    <div class="memory">
                        <img src="https://picsum.photos/300/300?random=2" alt="Memory 2">
                        <p>Unforgettable Trip</p>
                    </div>
                    <div class="memory">
                        <img src="https://picsum.photos/300/300?random=3" alt="Memory 3">
                        <p>Always Together</p>
                    </div>
                </div>
                <button class="btn" onclick="nextScreen('celebration')">Back to Counter ⏳</button>
            </div>
        </section>

    </main>

    <!-- RUTA CON VERSIÓN CLEAN PARA OBLIGAR AL MÓVIL A ACTUALIZAR TODO -->
    <script src="script.js?v=CLEAN_100"></script>
</body>
</html>
